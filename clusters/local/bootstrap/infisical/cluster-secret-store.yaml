apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: http://infisical-infisical.infisical.svc.cluster.local:8080
      auth:
        universalAuthCredentials:
          clientId:
            name: universal-auth-credentials
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: universal-auth-credentials
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: fullstack-template
        environmentSlug: dev
        secretsPath: /
        recursive: false
