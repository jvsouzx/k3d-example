apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: infisical-dragonfly
  namespace: infisical
spec:
  replicas: 1
  args:
    - "--requirepass=infisical"
    # Infisical uses BullMQ, whose Lua scripts access keys not declared in
    # KEYS[]. Dragonfly rejects undeclared keys by default, crashing the
    # Infisical backend. This flag restores Redis-compatible behavior.
    - "--default_lua_flags=allow-undeclared-keys"
