global:
  enabled: true
  tlsDisable: true

server:
  image:
    repository: openbao/openbao
    tag: 2.4.1

  dataStorage:
    enabled: false

  extraSecretEnvironmentVars:
    - envName: BAO_PG_CONNECTION_URL
      secretName: openbao-pg-app
      secretKey: uri
    - envName: OPENBAO_UNSEAL_KEY
      secretName: openbao-unseal
      secretKey: key

  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable     = 1
      }
      storage "postgresql" {
        table = "openbao_kv_store"
      }
      seal "static" {
        current_key_id = "local-1"
        current_key    = "env://OPENBAO_UNSEAL_KEY"
      }

  dev:
    enabled: false

  service:
    enabled: true
    type: ClusterIP

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: bao.local
        paths:
          - /

ui:
  enabled: true
